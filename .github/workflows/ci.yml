name: Tantra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: "Delete artifacts older than this many days (recent artifacts are preserved)"
        required: true
        default: "14"
        type: string
      run_retention_days:
        description: "Delete completed workflow runs and logs older than this many days"
        required: true
        default: "30"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: tantra-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compiler
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate cleanup settings
        env:
          ARTIFACT_DAYS: ${{ inputs.artifact_retention_days }}
          RUN_DAYS: ${{ inputs.run_retention_days }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_DAYS" =~ ^[0-9]+$ ]] && (( ARTIFACT_DAYS >= 1 && ARTIFACT_DAYS <= 3650 )) || {
            echo "artifact_retention_days must be between 1 and 3650." >&2
            exit 1
          }
          [[ "$RUN_DAYS" =~ ^[0-9]+$ ]] && (( RUN_DAYS >= 1 && RUN_DAYS <= 3650 )) || {
            echo "run_retention_days must be between 1 and 3650." >&2
            exit 1
          }

      - name: Remove Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t cache_ids < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --jq '.actions_caches[].id')
          count=0
          for cache_id in "${cache_ids[@]}"; do
            [[ -n "$cache_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
            count=$((count + 1))
          done
          echo "Deleted $count Actions cache entries."

      - name: Remove old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$RETENTION_DAYS days ago" +%s)"
          mapfile -t artifacts < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .created_at] | @tsv')
          count=0
          for row in "${artifacts[@]}"; do
            IFS=$'\t' read -r artifact_id created_at <<< "$row"
            [[ -n "$artifact_id" && -n "$created_at" ]] || continue
            created="$(date -u -d "$created_at" +%s)"
            if (( created < cutoff )); then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              count=$((count + 1))
            fi
          done
          echo "Deleted $count artifacts older than $RETENTION_DAYS days; newer artifacts were preserved."

      - name: Remove old completed workflow runs and logs
        env:
          GH_TOKEN: ${{ github.token }}
          RETENTION_DAYS: ${{ inputs.run_retention_days }}
        run: |
          set -euo pipefail
          cutoff="$(date -u -d "$RETENTION_DAYS days ago" +%s)"
          current_run="$GITHUB_RUN_ID"
          mapfile -t runs < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status == "completed") | [.id, .created_at] | @tsv')
          count=0
          for row in "${runs[@]}"; do
            IFS=$'\t' read -r run_id created_at <<< "$row"
            [[ -n "$run_id" && -n "$created_at" ]] || continue
            [[ "$run_id" == "$current_run" ]] && continue
            created="$(date -u -d "$created_at" +%s)"
            if (( created < cutoff )); then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
              count=$((count + 1))
            fi
          done
          echo "Deleted $count completed workflow runs older than $RETENTION_DAYS days; active runs and this cleanup run were preserved."

      - name: Cleanup summary
        if: always()
        run: |
          {
            echo "## Tantra GitHub Actions cleanup"
            echo "- All repository Actions caches were targeted for deletion."
            echo "- Artifacts older than ${{ inputs.artifact_retention_days }} days were targeted for deletion."
            echo "- Completed workflow runs/logs older than ${{ inputs.run_retention_days }} days were targeted for deletion."
            echo "- Active runs and this cleanup run were preserved."
            echo "- Workflow files were not automatically deleted; the repository currently has only the required `.github/workflows/ci.yml`."
          } >> "$GITHUB_STEP_SUMMARY"
